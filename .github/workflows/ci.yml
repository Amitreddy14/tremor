name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test (unit + envtest)
        run: make test
      - name: build
        run: make build

  e2e:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: tremor
          config: hack/kind-config-lite.yaml
      - name: build image and deploy operator
        run: make kind-deploy KIND_CLUSTER=tremor
      - name: end-to-end pod kill
        run: make e2e
