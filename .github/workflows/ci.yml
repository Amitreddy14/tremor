name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: make vet
      - name: test (unit + envtest)
        run: make test
      - name: build
        run: make build

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kustomize builds
        run: |
          kubectl kustomize config/default > /dev/null
          kubectl kustomize config/history > /dev/null
          kubectl kustomize config/demo > /dev/null
          kubectl kustomize config/monitoring > /dev/null
      - name: helm chart matches the kustomize manifests
        run: |
          python3 - <<'PY'
          import filecmp, sys, yaml
          for f in ("tremor.dev_chaosexperiments.yaml", "tremor.dev_chaosschedules.yaml"):
              if not filecmp.cmp(f"config/crd/bases/{f}", f"deploy/helm/tremor/crds/{f}", shallow=False):
                  sys.exit(f"{f}: deploy/helm/tremor/crds differs from config/crd/bases (copy it over)")
          kustomize = next(yaml.safe_load_all(open("config/rbac/role.yaml")))["rules"]
          text = open("deploy/helm/tremor/templates/rbac.yaml").read()
          chart = yaml.safe_load(text[text.index("rules:"):text.index("\n---")])["rules"]
          key = lambda r: (tuple(r["apiGroups"]), tuple(sorted(r["resources"])), tuple(sorted(r["verbs"])))
          if sorted(map(key, kustomize)) != sorted(map(key, chart)):
              sys.exit("deploy/helm/tremor/templates/rbac.yaml rules differ from config/rbac/role.yaml")
          print("crds and rbac in step")
          PY
      - uses: azure/setup-helm@v4
      - name: helm lint and template
        run: |
          helm lint deploy/helm/tremor
          helm template t deploy/helm/tremor > /dev/null
          helm template t deploy/helm/tremor --set history.mode=none --set forceDryRun=true --set 'allowedNamespaces={demo,staging}' > /dev/null
          helm template t deploy/helm/tremor --set history.mode=external --set history.existingSecret=atlas --set metrics.serviceMonitor.enabled=true > /dev/null
          helm template t deploy/helm/tremor --set history.builtin.persistence.enabled=true > /dev/null
          if helm template t deploy/helm/tremor --set history.mode=external 2> /tmp/err; then echo "external without a URI must fail"; exit 1; fi
          grep -q 'needs history.mongoUri' /tmp/err
      - name: dashboard is valid JSON
        run: python3 -m json.tool config/monitoring/dashboards/tremor.json > /dev/null

  e2e:
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: tremor
          config: hack/kind-config-lite.yaml
      - name: build image and deploy operator + history MongoDB
        run: make kind-deploy KIND_CLUSTER=tremor
      - name: deploy demo shop and MongoDB
        run: make demo-deploy KIND_CLUSTER=tremor
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: end-to-end pod kill, user-visible recovery and run history
        run: make e2e
      - name: safety guards and scheduling
        run: make e2e-schedule
      # Network faults need the sch_netem kernel module on the runner (kind nodes
      # share the host kernel). This step is informational: a runner image that
      # lacks the module must not block a merge. NodeDrain is skipped here
      # because the CI cluster has a single worker.
      - name: network fault checks (informational)
        continue-on-error: true
        run: |
          sudo modprobe sch_netem || { sudo apt-get update && sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe sch_netem; }
          make netem-load KIND_CLUSTER=tremor
          make e2e-faults
