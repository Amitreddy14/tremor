# Add 1.5 seconds of latency (plus up to 200 ms of jitter) to everything one
# shop pod sends, for 30 seconds. The pod's own readiness probe slows down past
# its 1 s timeout, so the pod goes unready: what users see depends on how fast
# the Service stops routing to it.
#
# Needs the tremor-netem image on the nodes (make netem-load) and a node kernel
# with the sch_netem module.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: shop-network-latency
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: NetworkLatency
    params:
      count: 1
      latency: 1500ms
      jitter: 200ms
      duration: 30s
  steadyState:
    http:
      url: http://shop.demo.svc.cluster.local:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 3
  recoveryTimeout: 120s
