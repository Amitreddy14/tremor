# Hold 64 MiB inside one shop pod for 30 seconds. The shop's memory limit is
# 128 MiB: stay below it to test memory pressure, go above it to see what an
# OOM kill does to your users.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: shop-memory-stress
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: MemoryStress
    params:
      count: 1
      memoryMiB: 64
      duration: 30s
  steadyState:
    http:
      url: http://shop.demo.svc.cluster.local:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 3
  recoveryTimeout: 120s
