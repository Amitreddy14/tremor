# A milder latency sample: 300ms (+/-50ms) on the shop's egress. A probe passes
# through two or three egress legs, so it stays under the 1s probe timeout and
# users see a slowdown rather than failures or readiness restarts.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: shop-network-latency-mild
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: NetworkLatency
    params:
      count: 1
      duration: 30s
      latency: 300ms
      jitter: 50ms
  steadyState:
    http:
      url: http://shop.demo.svc.cluster.local:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 3
  recoveryTimeout: 120s
