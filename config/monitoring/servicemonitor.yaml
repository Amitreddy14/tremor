# Requires the Prometheus Operator CRDs (installed by kube-prometheus-stack).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tremor
  labels:
    app.kubernetes.io/name: tremor
spec:
  namespaceSelector:
    matchNames:
      - tremor-system
  selector:
    matchLabels:
      app.kubernetes.io/name: tremor
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
