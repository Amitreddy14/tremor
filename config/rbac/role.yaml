apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tremor-manager-role
rules:
  - apiGroups: [tremor.dev]
    resources: [chaosexperiments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [tremor.dev]
    resources: [chaosexperiments/status]
    verbs: [get, update, patch]
  - apiGroups: [tremor.dev]
    resources: [chaosexperiments/finalizers]
    verbs: [update]
  # ChaosSchedule creates experiments on a cron schedule and prunes old ones.
  - apiGroups: [tremor.dev]
    resources: [chaosschedules]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [tremor.dev]
    resources: [chaosschedules/status]
    verbs: [get, update, patch]
  - apiGroups: [tremor.dev]
    resources: [chaosschedules/finalizers]
    verbs: [update]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # Ephemeral containers carry CPU and memory stress into target pods.
  - apiGroups: [""]
    resources: [pods/ephemeralcontainers]
    verbs: [update, patch]
  # NetworkLatency and NetworkLoss need no extra rights: they use the same
  # ephemeral containers. NodeDrain cordons a node and evicts pods from it.
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  # DependencyOutage scales a Deployment or StatefulSet to zero and back.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
