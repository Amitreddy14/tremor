# NetworkLatency, shown with the demo shop. A runnable copy lives in
# config/samples/shop-network-latency.yaml.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: shop-latency
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: NetworkLatency
    params:
      count: 1
      latency: 300ms
      jitter: 50ms
      duration: 60s
  steadyState:
    http:
      url: http://shop.demo.svc.cluster.local:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 3
  recoveryTimeout: 120s
