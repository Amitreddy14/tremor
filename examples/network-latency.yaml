apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: shop-latency
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: NetworkLatency
    params:
      latency: 300ms
      jitter: 50ms
  duration: 60s
  steadyState:
    http:
      url: http://shop.demo.svc:8080/healthz
      expectStatus: 200
    interval: 1s
    successThreshold: 3
    timeout: 120s
