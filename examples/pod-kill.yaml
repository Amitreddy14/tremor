# Kill one shop pod and measure both pod recovery and what users see.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: kill-shop
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: PodKill
    params:
      count: 1
  steadyState:
    http:
      url: http://shop.demo.svc.cluster.local:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 3
  recoveryTimeout: 120s
