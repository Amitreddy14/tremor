apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: kill-shop-pod
  namespace: demo
spec:
  target:
    selector:
      app: shop
  fault:
    type: PodKill
    params:
      count: 1
  steadyState:
    http:
      url: http://shop.demo.svc:8080/healthz
      expectStatus: 200
    interval: 1s
    successThreshold: 3
    timeout: 120s
