apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: mongo-outage
  namespace: demo
spec:
  target:
    selector:
      app: mongo
  fault:
    type: DependencyOutage
  duration: 45s
  steadyState:
    http:
      url: http://shop.demo.svc:8080/readyz
      expectStatus: 200
    interval: 1s
    successThreshold: 5
    timeout: 180s
