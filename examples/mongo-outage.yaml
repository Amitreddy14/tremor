# See config/samples/mongo-outage.yaml for the runnable version.
apiVersion: tremor.dev/v1alpha1
kind: ChaosExperiment
metadata:
  name: mongo-outage
  namespace: demo
spec:
  target:
    selector:
      app: mongo
  fault:
    type: DependencyOutage
    params:
      duration: 45s
  safety:
    allowTotalOutage: true
  steadyState:
    http:
      url: http://shop.demo.svc:8080/orders
      expectStatus: 200
    interval: 1s
    successThreshold: 5
  recoveryTimeout: 180s
