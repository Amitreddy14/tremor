---
# Mirrors controller-gen output from api/v1alpha1 (`make manifests` regenerates it).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: chaosschedules.tremor.dev
spec:
  group: tremor.dev
  names:
    kind: ChaosSchedule
    listKind: ChaosScheduleList
    plural: chaosschedules
    singular: chaosschedule
    shortNames:
    - cxs
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Schedule
      type: string
      jsonPath: .spec.schedule
    - name: Suspend
      type: boolean
      jsonPath: .spec.suspend
    - name: Last
      type: date
      jsonPath: .status.lastScheduleTime
    - name: Next
      type: date
      jsonPath: .status.nextScheduleTime
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp
    schema:
      openAPIV3Schema:
        type: object
        description: ChaosSchedule runs a ChaosExperiment on a cron schedule.
        required:
        - spec
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - schedule
            - template
            properties:
              schedule:
                type: string
                minLength: 1
              suspend:
                type: boolean
              concurrencyPolicy:
                type: string
                enum:
                - Forbid
                - Allow
                default: Forbid
              startingDeadlineSeconds:
                type: integer
                format: int64
                minimum: 1
                default: 300
              successfulRunsHistoryLimit:
                type: integer
                format: int32
                minimum: 0
                default: 3
              failedRunsHistoryLimit:
                type: integer
                format: int32
                minimum: 0
                default: 3
              template:
                type: object
                required:
                - spec
                properties:
                  labels:
                    type: object
                    additionalProperties:
                      type: string
                  spec:
                    type: object
                    required:
                    - target
                    - fault
                    properties:
                      target:
                        type: object
                        required:
                        - selector
                        properties:
                          selector:
                            type: object
                            minProperties: 1
                            additionalProperties:
                              type: string
                      fault:
                        type: object
                        required:
                        - type
                        properties:
                          type:
                            type: string
                            enum:
                            - PodKill
                            - DependencyOutage
                            - CPUStress
                            - MemoryStress
                            - NetworkLatency
                            - NetworkLoss
                            - NodeDrain
                          params:
                            type: object
                            properties:
                              count:
                                type: integer
                                format: int32
                                minimum: 1
                              duration:
                                description: 'Duration is how long a sustained fault
                                  (DependencyOutage, CPUStress,

                                  MemoryStress, NetworkLatency, NetworkLoss) stays
                                  active. Default 30s, between 1s and 10m.'
                                type: string
                              cpuWorkers:
                                description: CPUWorkers is the number of busy loops
                                  per pod for CPUStress (default 1).
                                type: integer
                                format: int32
                                minimum: 1
                                maximum: 64
                              memoryMiB:
                                description: MemoryMiB is the memory held per pod
                                  for MemoryStress (default 256).
                                type: integer
                                format: int32
                                minimum: 1
                                maximum: 16384
                              latency:
                                description: Latency is the delay added by NetworkLatency
                                  (default 200ms, up to 10s).
                                type: string
                              jitter:
                                description: Jitter is the random variation of the
                                  delay, at most the latency (NetworkLatency only,
                                  default none).
                                type: string
                              lossPercent:
                                description: LossPercent is the share of packets NetworkLoss
                                  drops (default 20).
                                type: integer
                                format: int32
                                minimum: 1
                                maximum: 100
                      safety:
                        type: object
                        properties:
                          dryRun:
                            type: boolean
                          maxAffectedPercent:
                            type: integer
                            format: int32
                            minimum: 1
                            maximum: 100
                            default: 50
                          allowTotalOutage:
                            type: boolean
                      steadyState:
                        type: object
                        required:
                        - http
                        properties:
                          http:
                            type: object
                            required:
                            - url
                            properties:
                              url:
                                type: string
                                minLength: 1
                              expectStatus:
                                type: integer
                                format: int32
                                minimum: 100
                                maximum: 599
                                default: 200
                          interval:
                            type: string
                          successThreshold:
                            type: integer
                            format: int32
                            minimum: 1
                            default: 3
                      recoveryTimeout:
                        type: string
          status:
            type: object
            properties:
              lastScheduleTime:
                type: string
                format: date-time
              nextScheduleTime:
                type: string
                format: date-time
              lastExperiment:
                type: string
              active:
                type: array
                items:
                  type: string
              message:
                type: string
              observedGeneration:
                type: integer
                format: int64
