apiVersion: v1
kind: Service
metadata:
  name: {{ include "tremor.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tremor.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector:
    {{- include "tremor.selector" . | nindent 4 }}
    app.kubernetes.io/component: manager
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tremor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tremor.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "tremor.selector" . | nindent 6 }}
      app.kubernetes.io/component: metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
